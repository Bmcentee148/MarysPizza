[build]
  command = "cd src && python3 build.py"
  publish = "dist"

# Old WordPress URLs -> pages on this site (301). The full crawl and the reasoning
# for each target are in redirect-plan.md. Netlify matches a path with or without
# its trailing slash. Pages that were never real content (the theme demo /home-2/,
# the "Hello world!" post and its archives, wp-login, feeds) have no rule on purpose:
# they get the 404 page. build.py checks that every "to" is a page this site builds
# (or a planned one) and that no "from" is a page that exists.

# --- Location pages (old store homepages and About Us pages) ---
[[redirects]]
  from = "/home-speonk/"
  to = "/speonk/"
  status = 301
[[redirects]]
  from = "/about-us-speonk/"
  to = "/speonk/"
  status = 301
[[redirects]]
  from = "/home-islip/"
  to = "/islip-terrace/"
  status = 301
[[redirects]]
  from = "/home-islip-2024/"
  to = "/islip-terrace/"
  status = 301
[[redirects]]
  from = "/about-us-islip/"
  to = "/islip-terrace/"
  status = 301
[[redirects]]
  from = "/home-farmingdale/"
  to = "/farmingdale/"
  status = 301
[[redirects]]
  from = "/home-farmingdale-2025/"
  to = "/farmingdale/"
  status = 301
[[redirects]]
  from = "/about-us-farmingdale/"
  to = "/farmingdale/"
  status = 301

